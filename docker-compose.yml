services:
  passage:
    build: .
    image: passage-web:latest
    # Always build on the host; the image is never published to a registry.
    pull_policy: build
    container_name: passage
    ports:
      # Host port 8095 to stay clear of common NAS services (e.g. Nginx Proxy
      # Manager claims 8080). Change the left side if 8095 is taken too.
      - "8095:8080"
    volumes:
      # Set PASSAGE_DATA to a host path (e.g. /volume1/docker/passage/data)
      # to bind-mount an existing folder instead of the named volume.
      - ${PASSAGE_DATA:-passage-data}:/data
    restart: unless-stopped

volumes:
  passage-data:
